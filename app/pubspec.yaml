name: delivery_dapp
description: A decentralized delivery tracking system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  web3dart: ^2.7.1
  http: ^1.1.0
  shared_preferences: ^2.2.0
  intl: ^0.20.2
  walletconnect_flutter_v2: ^2.1.0
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^9.0.0
  google_maps_flutter: ^2.5.0
  geolocator: ^12.0.0
  flutter_local_notifications: ^19.4.2
  url_launcher: ^6.1.12
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  file_picker: ^8.0.7
  image: ^4.1.3
  go_router: ^16.2.4
  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.6
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  analyzer: ^8.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/abi/
    - assets/config/ 