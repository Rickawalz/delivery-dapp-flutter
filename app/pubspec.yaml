name: delivery_dapp
description: A decentralized delivery tracking system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  web3dart: ^2.7.1
  http: ^1.1.0
  shared_preferences: ^2.2.0
  intl: ^0.18.1
  walletconnect_dart: ^0.0.11
  flutter_secure_storage: ^9.0.0
  google_maps_flutter: ^2.5.0
  geolocator: ^10.0.0
  flutter_local_notifications: ^15.1.0+1
  url_launcher: ^6.1.12
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  flutter_dotenv: ^5.1.0
  file_picker: ^6.1.1
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  analyzer: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/abi/
    - assets/config/
    - .env 